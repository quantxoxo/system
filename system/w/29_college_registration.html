<!DOCTYPE html>
<html>
<head>
    <title>College Registration Form</title>

    <style>
        body {
            background-color: #ffffdd;
            font-family: Arial;
        }

        form {
            width: 600px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-family: "Times New Roman";
        }

        label {
            display: inline-block;
            width: 130px;
            margin: 8px;
        }

        input, select, textarea {
            padding: 5px;
        }

        textarea {
            width: 315px;
            height: 60px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>My-Future College / School</h1>

<p style="text-align:center;">Please Fill Below Detail In Student Registration Form</p>

<form>

    <label>Student name:</label>
    <input type="text"
           minlength="3"
           maxlength="10"
           required>
    <br>

    <label>Date of birth:</label>
    <input type="date" required>
    <br>

    <label>Mobile no.:</label>
    <input type="tel"
           pattern="[0-9]{10}"
           maxlength="10"
           required>
    <br>

    <label>Email id:</label>
    <input type="email" required>
    <br>

    <label>Password:</label>
    <input type="password"
           minlength="8"
           required>
    <br>

    <label>Gender:</label>
    <input type="radio" name="gender" required> Male
    <input type="radio" name="gender"> Female
    <br>

    <label>Hobbies:</label>
    <input type="checkbox"> Drawing
    <input type="checkbox"> Singing
    <input type="checkbox"> Dancing
    <input type="checkbox"> Sketch
    <input type="checkbox"> Sports
    <br>

    <label>Course:</label>
    <select required>
        <option value="">Select Admission Course</option>
        <option>BCA</option>
        <option>B.Sc</option>
        <option>BBA</option>
        <option>BE</option>
        <option>MCA</option>
    </select>
    <br>

    <label>Student photo:</label>
    <input type="file" accept="image/*">
    <br>

    <label>Register Time:</label>
    <input type="time" required>
    <br>

    <label>Address:</label>
    <textarea required></textarea>
    <br>

    <label>
        <input type="checkbox" required>
    </label>
    I hereby declare that above information provided is correct

    <div class="buttons">
        <input type="submit" value="Register">
        <input type="reset" value="Reset">
    </div>

</form>

</body>
</html>
