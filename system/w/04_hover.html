<!DOCTYPE html>
<html>
<head>
    <title>Hover Effect</title>

    <style>
        button {
            padding: 10px 20px;
            background: blue;
            color: white;
        }

        button:hover {
            background: green;
            cursor: pointer;
        }

        a {
            color: blue;
            margin: 20px;
        }

        a:hover {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

<button>Move Mouse Here</button>

<a href="#">Move Mouse Here</a>

</body>
</html>
