<!DOCTYPE html>
<html>
<head>
    <title>College Homepage</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial;
        }

        header {
            background: navy;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: lightblue;
            padding: 15px;
        }

        nav a {
            text-decoration: none;
            color: black;
        }

        .content {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 40px;
            min-height: 300px;
        }

        .box {
            padding: 30px;
            background: lightgray;
            text-align: center;
        }

        footer {
            background: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            nav, .content {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>ABC College</h1>
    <p>Welcome to Our College</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<div class="content">
    <div class="box">
        <h2>Courses</h2>
        <p>We offer many courses.</p>
    </div>

    <div class="box">
        <h2>Facilities</h2>
        <p>Library, Labs and Sports.</p>
    </div>

    <div class="box">
        <h2>Admission</h2>
        <p>Admissions are open.</p>
    </div>
</div>

<footer>
    <p>© 2026 ABC College</p>
</footer>

</body>
</html>
