<!DOCTYPE html>
<html>
<head>
    <title>Change Image</title>
</head>

<body>

<h2>Image Change</h2>

<img id="myImage"
     src="https://picsum.photos/200/150?1"
     width="200">

<br><br>

<button onclick="changeImage()">Change Image</button>

<script>
    function changeImage() {
        document.getElementById("myImage").src =
            "https://picsum.photos/200/150?2";
    }
</script>

</body>
</html>
