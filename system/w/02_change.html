<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>

<body>

<h1 id="heading">Hello! Welcome</h1>

<button onclick="changeText()">Click Me</button>

<script>
    function changeText() {
        document.getElementById("heading").innerHTML =
            "Text Changed Successfully!";
    }
</script>

</body>
</html>
